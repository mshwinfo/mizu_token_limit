router_settings:
  routing_strategy: usage-based-routing-v2

  # 打不通時的降級鏈：Agnes 掛了就退回地端 Qwen
  fallbacks:
    - agnes-flash: ["local-qwen"]

  # 429 專用降級（跟一般錯誤分開處理）
  context_window_fallbacks: []
  num_retries: 3
  retry_after: 5
  allowed_fails: 3
  cooldown_time: 60          # 連續失敗後把該 model 冷卻 60 秒
  timeout: 300


litellm_settings:
  drop_params: true          # 上游不支援的參數自動丟掉，避免 400
  request_timeout: 300
  set_verbose: false
  # 用量記帳不用另外設 callback —
  # general_settings.database_url 設好後，每筆請求會自動寫進
  # LiteLLM_SpendLogs，供報表 / dashboard 讀


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # 讓 Admin UI（http://<host>:4000/ui）上新增 / 修改的模型存進 DB，
  # 即時生效、不用改這個檔也不用重啟容器。
  # config.yaml 裡的 model_list 仍會照常載入，兩邊並存。
  store_model_in_db: true

  # 多個 LiteLLM 副本共用 RPM / TPM / 預算計數。
  # ⚠️ 不能拿掉：沒有它，每個副本各算各的，
  #    實測 4 副本時 key 設 RPM 4 會放行 15 發、團隊預算也會超支
  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

  # 每把 virtual key 可獨立設預算與限速 —
  # 這正好對應你「多組織 / 多團隊分攤成本」的需求
  # 建 key：
  #   curl -X POST http://localhost:4000/key/generate \
  #     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
  #     -H "Content-Type: application/json" \
  #     -d '{"models":["agnes-flash"],"rpm_limit":5,
  #          "max_budget":10,"metadata":{"team":"sre","host":"agent-qa02"}}'
