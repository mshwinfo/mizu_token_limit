# ============================================================
#  LiteLLM Proxy 設定
#  掛在 Hermes / OpenClaw 前面，做真正的 RPM / TPM 節流 + 記帳
# ============================================================

model_list:

  # ---- Agnes（免費但 20 RPM，留 buffer 設 15）----
  - model_name: agnes-flash
    litellm_params:
      model: openai/agnes-2.5-flash          # openai/ 前綴 = 走 OpenAI 相容協定
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      rpm: 15                                 # ← 這裡是真正的節流
      tpm: 300000
      timeout: 300
    model_info:
      # Agnes 目前標 $0，但標準價是 0.03 / 0.15 per 1M
      # 先按標準價記帳，之後恢復收費時報表不用重算
      input_cost_per_token:  0.00000003
      output_cost_per_token: 0.00000015

  # ---- 地端 Qwen（心跳 / 低價值任務走這條，不消耗雲端配額）----
  - model_name: local-qwen
    litellm_params:
      model: openai/qwen2.5:14b
      # ⚠️ LiteLLM 跑在容器裡，127.0.0.1 是容器自己，打不到宿主機！
      # 要用 host.docker.internal（docker-compose 已設 extra_hosts 對應）
      api_base: http://host.docker.internal:11434/v1   # 宿主機上的 Ollama
      api_key: "dummy"
      rpm: 600
    model_info:
      input_cost_per_token:  0
      output_cost_per_token: 0

  # ============================================================
  #  其他家模型 —— 要用哪家就：
  #    1. 在 .env 填該家的 API key
  #    2. 把下面對應區塊解除註解
  #    3. docker compose restart litellm
  #  或者不改檔，直接在 Web UI（/ui → Models → Add Model）新增，即時生效。
  #
  #  model_name 是 agent 和 access/teams.yaml 用的名字，可以自己取；
  #  model 是「provider/官方型號」，型號以各家官網為準。
  #  以下型號都在 LiteLLM 內建價目表裡，費用會自動計算，不用填 cost。
  #  rpm / tpm 請依你帳號在該家的實際額度填，留 buffer。
  # ============================================================

