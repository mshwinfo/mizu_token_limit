# ============================================================
#  LiteLLM 前面的分流器（docker-compose 的 nginx 服務會掛載這個檔）
#
#  為什麼需要：單一 LiteLLM 程序只吃得到一顆 CPU；開多 worker 時，
#  長連線會黏在同一個 worker 上，實測 200 人時一個 worker 跑滿、
#  其他閒置，首字延遲從 0.4 秒拉長到 3 秒。
#  改成多個 LiteLLM 副本、由 nginx 用 least_conn 把每個請求
#  交給「手上最少請求」的副本，負載才會平均。
# ============================================================

# Docker 內建 DNS。副本數變動或容器重啟換 IP 時，10 秒內自動跟上
resolver 127.0.0.11 valid=10s ipv6=off;

upstream litellm_backend {
    zone litellm_backend 64k;
    least_conn;
    # resolve：執行期持續解析 litellm 這個服務名，拿到所有副本的 IP
    server litellm:4000 resolve;
    keepalive 64;
}

server {
    listen 4000;

    # 請求體可能很大（長 context、base64 圖片）
    client_max_body_size 32m;

    location / {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming：不緩衝，逐字轉發
        proxy_buffering off;
        proxy_cache     off;

        # LLM 回應很慢，逾時要放寬
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
