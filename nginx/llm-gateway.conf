# ============================================================
#  LLM Gateway - nginx 限流反向代理
#  用途：在 Hermes / OpenClaw 與上游 LLM provider 之間做 RPM 節流
#  放置：/etc/nginx/conf.d/llm-gateway.conf
# ============================================================

# ------------------------------------------------------------
#  【關鍵】限流 zone 定義  — 必須放在 http {} 層級
# ------------------------------------------------------------
#
#  ⚠️ 最重要的一件事：key 要用「常數」，不要用 $binary_remote_addr
#
#  provider 的 RPM 是綁「帳號 / API Key」的，不是綁來源 IP。
#  如果你用 $binary_remote_addr，agent-qa02 和 agent-as06 會
#  各自拿到 15 RPM，加起來 30 RPM → 照樣打爆 Agnes 的 20 RPM。
#
#  用 $server_name（在同一個 server block 內是固定字串）
#  才會得到「全域共用一個桶子」的效果。
#
limit_req_zone $server_name zone=agnes_global:10m rate=15r/m;
limit_req_zone $server_name zone=oai_global:10m   rate=400r/m;

# 併發連線上限（防止 agent 開一堆 long-running streaming 佔滿）
limit_conn_zone $server_name zone=agnes_conn:10m;

# 被限流時回 429（nginx 預設是 503，agent 不一定認得）
limit_req_status  429;
limit_conn_status 429;

# 把限流事件寫進 error log，方便 grep
limit_req_log_level warn;

# ------------------------------------------------------------
#  上游定義
# ------------------------------------------------------------
upstream agnes_upstream {
    server apihub.agnes-ai.com:443;
    keepalive 8;
    keepalive_timeout 60s;
}

# ------------------------------------------------------------
#  Server
# ------------------------------------------------------------
server {
    listen 8080;
    server_name llm-gw;          # ← 限流 key 就是這個字串，保持固定

    access_log /var/log/nginx/llm-gateway.access.log;
    error_log  /var/log/nginx/llm-gateway.error.log warn;

    # 請求體可能很大（512K context、base64 圖片）
    client_max_body_size 32m;
    client_body_buffer_size 1m;

    # --------------------------------------------------------
    #  健康檢查（不限流）
    # --------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------
    #  Agnes：15 RPM，burst 佇列 12 筆
    # --------------------------------------------------------
    location /agnes/ {

        # burst=12  → 超過速率的請求最多排隊 12 筆
        # 【不要加 nodelay】加了就變成「立刻放行 burst 再拒絕」，
        #  我們要的是「排隊等」，所以省略 nodelay。
        limit_req  zone=agnes_global burst=12;

        # 同時最多 4 條 streaming 連線
        limit_conn agnes_conn 4;

        # 排隊的請求會佔住連線，等待上限拉長一點
        client_body_timeout 60s;
        send_timeout        300s;

        # ---- 路徑改寫：/agnes/v1/xxx → /v1/xxx ----
        rewrite ^/agnes/(.*)$ /$1 break;

        proxy_pass https://agnes_upstream;

        # ---- TLS / SNI（走 HTTPS 上游必要）----
        proxy_ssl_server_name on;
        proxy_ssl_name        apihub.agnes-ai.com;
        proxy_set_header Host apihub.agnes-ai.com;

        # ---- SSE streaming 必要設定 ----
        # 沒有這三行，stream:true 會被 nginx 緩衝住，
        # 變成等全部生成完才一次吐出來，agent 會誤判成逾時。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # ---- LLM 回應很慢，逾時要放寬 ----
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # ---- 【選用】在 gateway 側注入 API Key ----
        # 打開這行的話，agent 端就不用持有真正的金鑰，
        # 只要打 http://llm-gw:8080/agnes/v1/... 即可。
        # 金鑰集中在這台機器，配合下面的 include 檔（chmod 600）。
        #
        # include /etc/nginx/secrets/agnes-key.conf;
        #
        # 該檔內容為一行：
        #   proxy_set_header Authorization "Bearer sk-xxxxxxxx";
        #
        # 若不用注入，就讓 agent 自己帶 header（預設會自動轉發）。

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    #  範例：其他 provider 照這個 pattern 加
    # --------------------------------------------------------
    # location /openai/ {
    #     limit_req zone=oai_global burst=50;
    #     rewrite ^/openai/(.*)$ /$1 break;
    #     proxy_pass https://api.openai.com;
    #     proxy_ssl_server_name on;
    #     proxy_set_header Host api.openai.com;
    #     proxy_buffering off;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_read_timeout 300s;
    # }
}
