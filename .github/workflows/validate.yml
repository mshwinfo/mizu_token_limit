name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          # 用 os.walk 而不是 pathlib.rglob —
          # rglob 的萬用字元不會進入 .github 等點開頭目錄，
          # 會漏掉 workflow 檔自己
          python3 -c "
          import yaml, sys, os
          bad = False
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith(('.yml', '.yaml')):
                      continue
                  p = os.path.join(root, f)
                  try:
                      with open(p) as fh:
                          list(yaml.safe_load_all(fh))
                      print(f'OK  {p}')
                  except Exception as e:
                      print(f'ERR {p}: {e}'); bad = True
          sys.exit(1 if bad else 0)
          "

      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" nginx:alpine \
            nginx -t 2>&1 | tee /tmp/out
          # 只在 conf.d 內容有語法錯時失敗；缺少外部 include 屬預期
          grep -q "syntax is ok" /tmp/out || \
            grep -q "open() \"/etc/nginx/secrets" /tmp/out

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Scan for committed secrets
        run: |
          if grep -rInE '(sk-[a-zA-Z0-9]{20,}|Bearer [a-zA-Z0-9_\-]{20,})' \
               --exclude-dir=.git --exclude='*.md' . ; then
            echo "::error::疑似有金鑰被 commit 進來"
            exit 1
          fi
          echo "未發現外洩金鑰"

  # ------------------------------------------------------------
  #  自動合併：lint 全過的 PR 直接 squash 進 main
  #
  #  ・只處理「非 draft」的 PR —— 還不想合的就保持 draft 狀態
  #  ・合併後自動刪除來源分支
  #  ・⚠️ 任何人開的 PR 只要 lint 過都會被合併；
  #    這個 repo 目前是個人設定檔專案所以可接受，
  #    若之後有外部協作者，把下面的 if 加上
  #    github.event.pull_request.user.login == 'mshwinfo'
  # ------------------------------------------------------------
  automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch \
            "${{ github.event.pull_request.html_url }}"
