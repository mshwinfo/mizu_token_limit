name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          # 用 os.walk 而不是 pathlib.rglob —
          # rglob 的萬用字元不會進入 .github 等點開頭目錄，
          # 會漏掉 workflow 檔自己
          python3 -c "
          import yaml, sys, os
          bad = False
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith(('.yml', '.yaml')):
                      continue
                  p = os.path.join(root, f)
                  try:
                      with open(p) as fh:
                          list(yaml.safe_load_all(fh))
                      print(f'OK  {p}')
                  except Exception as e:
                      print(f'ERR {p}: {e}'); bad = True
          sys.exit(1 if bad else 0)
          "

      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" nginx:alpine \
            nginx -t 2>&1 | tee /tmp/out
          # 只在 conf.d 內容有語法錯時失敗；缺少外部 include 屬預期
          grep -q "syntax is ok" /tmp/out || \
            grep -q "open() \"/etc/nginx/secrets" /tmp/out

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Scan for committed secrets
        run: |
          if grep -rInE '(sk-[a-zA-Z0-9]{20,}|Bearer [a-zA-Z0-9_\-]{20,})' \
               --exclude-dir=.git --exclude='*.md' . ; then
            echo "::error::疑似有金鑰被 commit 進來"
            exit 1
          fi
          echo "未發現外洩金鑰"
